name: APK Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compila l'APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Pubblica l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ApexLap.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ApexLap.apk --title "ApexLap per Android" --notes "Scarica ApexLap.apk sul telefono e installalo. Build ${{ github.run_number }}."
