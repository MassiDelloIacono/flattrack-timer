<script>
window.__errs=[];
window.addEventListener('error',e=>{window.__errs.push((e.message||'errore')+' @'+(e.lineno||'?'))});
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}

<script>
{
// ===================== utilità geografiche =====================
const R=6371000,D2R=Math.PI/180;
const hav=(a,b,c,d)=>{const x=Math.sin((c-a)*D2R/2)**2+Math.cos(a*D2R)*Math.cos(c*D2R)*Math.sin((d-b)*D2R/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};
let origin=null;
const toLocal=(lat,lon)=>({x:(lon-origin.lon)*D2R*R*Math.cos(origin.lat*D2R),y:(lat-origin.lat)*D2R*R});

// ===================== logica giri (come il firmware) =====================
class LapTimer{
  constructor(){this.minLapMs=8000;this.line=null;this.resetSession();this.havePrev=false}
  setLine(l){this.line={...l};const h=l.heading*D2R;this.dx=Math.sin(h);this.dy=Math.cos(h);this.nx=Math.cos(h);this.ny=-Math.sin(h);this.havePrev=false;this.inLap=false}
  clearLine(){this.line=null;this.havePrev=false;this.inLap=false}
  resetSession(){this.prevBest=0;this.inLap=false;this.tr=[];this.best=[];this.laps=[];this.bestMs=0;this.bestNo=0;this.lastMs=0;this.lastWasBest=false;this.deltaValid=false;this.delta=0;this.curDist=0;this.ends=[]}
  crosses(x1,y1,x2,y2){const L=this.line,half=L.width/2,ax=L.x-this.nx*half,ay=L.y-this.ny*half,sx=this.nx*L.width,sy=this.ny*L.width,rx=x2-x1,ry=y2-y1;
    if(rx*this.dx+ry*this.dy<=0)return -1;const den=rx*sy-ry*sx;if(Math.abs(den)<1e-9)return -1;const qx=ax-x1,qy=ay-y1;const t=(qx*sy-qy*sx)/den,u=(qx*ry-qy*rx)/den;return(t>=0&&t<=1&&u>=0&&u<=1)?t:-1}
  update(f){if(!f.valid||!this.line){this.havePrev=false;return false}let done=false;
    if(this.havePrev&&f.t>this.pt){const seg=Math.hypot(f.x-this.px,f.y-this.py),t=this.crosses(this.px,this.py,f.x,f.y),tc=this.pt+Math.round(Math.max(t,0)*(f.t-this.pt));
      if(t>=0&&(!this.inLap||tc-this.start>=this.minLapMs)){
        if(this.inLap){const ms=tc-this.start;this.tr.push([this.curDist+seg*t,ms]);this.laps.push(ms);this.lastMs=ms;this.lastWasBest=!this.bestMs||ms<this.bestMs;
          if(this.lastWasBest){this.prevBest=this.bestMs;this.bestMs=ms;this.bestNo=this.laps.length;this.best=this.tr.slice()}done=true}
        if(!this.inLap&&this.firstStart==null)this.firstStart=tc;this.inLap=true;this.start=tc;this.curDist=seg*(1-t);this.tr=[[0,0],[this.curDist,f.t-tc]];
      }else if(this.inLap){this.curDist+=seg;this.tr.push([this.curDist,f.t-this.start])}}
    this.px=f.x;this.py=f.y;this.pt=f.t;this.havePrev=true;this.computeDelta(f.t);return done}
  computeDelta(t){this.deltaValid=false;const b=this.best;if(!this.inLap||b.length<2||this.curDist>b[b.length-1][0])return;
    let lo=0,hi=b.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(b[m][0]<=this.curDist)lo=m;else hi=m}
    const f=b[hi][0]>b[lo][0]?(this.curDist-b[lo][0])/(b[hi][0]-b[lo][0]):0;this.delta=((t-this.start)-(b[lo][1]+f*(b[hi][1]-b[lo][1])))/1000;this.deltaValid=true}
  cur(t){return this.inLap?Math.max(0,t-this.start):0}
}

// ===================== memoria =====================
const VERSION='v70';const LS='ftt-app-v1';let saved={tracks:[],view:0,minLap:8,source:'phone',session:null,showSpeed:false,theme:'auto',dmode:'sec'};
try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j)saved={...saved,...j}}catch(e){}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(saved))}catch(e){}};
saved.tracks.forEach((t,i)=>{if(!t.name)t.name='Pista '+(i+1)});
const newTrackName=()=>{let k=saved.tracks.length+1;while(saved.tracks.some(t=>t.name==='Pista '+k))k++;return'Pista '+k};
const trackName=()=>dev.track>=0&&saved.tracks[dev.track]?saved.tracks[dev.track].name:'';
function useTrack(i){const tk=saved.tracks[i];if(!tk)return;if(!origin)origin={lat:tk.lat,lon:tk.lon};const q=toLocal(tk.lat,tk.lon);lt.setLine({x:q.x,y:q.y,heading:tk.heading,width:tk.width});dev.track=i;if(saved.lastTrack!==i){saved.lastTrack=i;persist()}applyMinLap()}

if(!saved.viewFix){saved.view=0;saved.viewFix=1;persist()}
const lt=new LapTimer();lt.minLapMs=saved.minLap*1000;
// ---------- turni e giornate ----------
// un turno nuovo quando fra la fine di un giro e l'inizio del successivo passano più di 2 minuti (sosta ai box)
const TURN_GAP=120000;
function turnsOf(L,E,K){const out=[];for(let i=0;i<L.length;i++){const st=E&&E[i]?E[i]-L[i]:null,prev=E&&i?E[i-1]:null;
  if(!out.length||(st!=null&&prev!=null&&st-prev>TURN_GAP)||(K&&i&&K[i]!==K[i-1]))out.push([]);out[out.length-1].push(i)}return out}
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
// la giornata finita va nell'archivio: si salva da sola, nessun pulsante da ricordare
function archiveSession(){const S=saved.session;if(!S||!S.laps||!S.laps.length)return false;
  const nm=S.trackName||((saved.tracks[S.track]||{}).name)||'Pista',D=saved.days||(saved.days=[]),d0=D[0];
  const part={laps:S.laps.slice(),ends:S.laps.map((_,i)=>(S.ends||[])[i]||null),trk:S.laps.map(()=>nm)};
  // stessa data: i giri si aggiungono alla giornata già salvata (es. ovale al mattino, TT al pomeriggio)
  if(d0&&!d0.closed&&dayKey(d0.date)===dayKey(S.date)){dayFix(d0);d0.laps=d0.laps.concat(part.laps);d0.ends=d0.ends.concat(part.ends);d0.trk=d0.trk.concat(part.trk);d0.date=S.date}
  else D.unshift({date:S.date,track:nm,laps:part.laps,ends:part.ends,trk:part.trk});
  if(saved.days.length>300)saved.days.length=300;saved.session=null;persist();return true}
function dayFix(d){if(!d.ends)d.ends=[];while(d.ends.length<d.laps.length)d.ends.push(null);if(!d.trk||d.trk.length!==d.laps.length)d.trk=d.laps.map((_,i)=>(d.trk||[])[i]||d.track||'Pista');return d}
const dayTracks=d=>{const o=[];dayFix(d).trk.forEach(t=>{if(o.indexOf(t)<0)o.push(t)});return o};
// giornate salvate separate nello stesso giorno (versioni vecchie): le unisco
(function(){const D=saved.days;if(!D||D.length<2)return;let ch=false;for(let i=0;i<D.length-1;){if(dayKey(D[i].date)===dayKey(D[i+1].date)){const a=dayFix(D[i+1]),b=dayFix(D[i]);
  D[i]={date:b.date,track:a.track,laps:a.laps.concat(b.laps),ends:a.ends.concat(b.ends),trk:a.trk.concat(b.trk)};D.splice(i+1,1);ch=true}else i++}if(ch)persist()})();
if(saved.session&&saved.session.laps&&saved.session.laps.length&&dayKey(saved.session.date)!==dayKey(Date.now()))archiveSession();
if(saved.session&&saved.session.laps&&saved.session.laps.length){const L=saved.session.laps;lt.laps=L.slice();lt.lastMs=L[L.length-1];
  lt.ends=L.map((_,i)=>(saved.session.ends||[])[i]||null);
  if(saved.session.best&&saved.session.best.length>1)lt.best=saved.session.best;
  L.forEach((ms,i)=>{if(!lt.bestMs||ms<lt.bestMs){lt.bestMs=ms;lt.bestNo=i+1}})}
// salvo anche la traccia del giro migliore: senza, dopo un riavvio dell'app delta e settori restavano spenti
const saveSession=()=>{saved.session={laps:lt.laps,ends:lt.ends,best:lt.best.map(q=>[Math.round(q[0]*100)/100,Math.round(q[1])]),track:dev.track,trackName:trackName(),date:new Date().toISOString()};persist()};
function closeDay(){saveSession();const ok=archiveSession();const d0=(saved.days||[])[0];if(d0&&dayKey(d0.date)===dayKey(Date.now()))d0.closed=true;lt.resetSession();saveSession();return ok}
function switchTrackKeepDay(){saveSession();archiveSession();lt.resetSession();saveSession()}
// giro minimo: in automatico metà del record di quella pista (ovale e TT hanno valori diversi da soli)
function effMinLap(){const tk=saved.tracks[dev.track];if(saved.minLapAuto!==false&&tk&&tk.record)return Math.max(4,Math.round(tk.record*0.5/1000));return saved.minLap}
function applyMinLap(){lt.minLapMs=effMinLap()*1000}

const dev={sats:0,fix:false,hAcc:99,speed:0,gps:null,screen:'boot',wiz:0,pend:null,flashUntil:0,stillSince:null,toast:null,toastUntil:0,scroll:0,track:-1,
  lastT:0,lastPerf:0,battery:null,charging:false,geoErr:null,prev:null,lastHd:0,startedAt:performance.now()};
const now=()=>performance.now();
function toast(a,ms=2200){dev.toast=a;dev.toastUntil=now()+ms}
const gpsTime=()=>dev.lastT?dev.lastT+Math.min(1500,now()-dev.lastPerf):0;

// tracciato di un giro: un punto ogni ~1,5 m, in decimetri rispetto al traguardo di allora, con la velocità
function buildTrace(pts,tk,ms){if(!pts||pts.length<10)return null;const o=[tk.lat,tk.lon],kx=R*D2R*Math.cos(o[0]*D2R),ky=R*D2R,out=[];let lx=null,ly=null;
  for(const p of pts){const x=(p[1]-o[1])*kx,y=(p[0]-o[0])*ky;if(lx==null||Math.hypot(x-lx,y-ly)>=1.5){out.push([Math.round(x*10),Math.round(y*10),Math.round(p[2])]);lx=x;ly=y}if(out.length>=2500)break}
  return out.length>=10?{o,p:out,ms,d:Date.now()}:null}
// ===================== settori: da 4 a 8 per pista, il pilota sceglie quanti e dove =====================
const SEC_MIN=4,SEC_MAX=8;
const eqSplits=n=>{const o=[];for(let k=1;k<n;k++)o.push(k/n);return o};
function secCount(tk){if(tk&&tk.sec&&tk.sec.n)return tk.sec.n;const ms=tk&&tk.trace&&tk.trace.ms;return ms?Math.max(SEC_MIN,Math.min(SEC_MAX,Math.round(ms/5000))):SEC_MIN}
function secFracs(tk){const n=secCount(tk);return tk&&tk.sec&&tk.sec.f&&tk.sec.f.length===n-1?tk.sec.f:eqSplits(n)}
const traceCum=tr=>{const p=tr.p,cum=[0];for(let i=1;i<p.length;i++)cum.push(cum[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1])/10);return cum};
// confini dei settori come frazioni del giro; i = punto del tracciato (per disegnarli sulla mappa)
function trackSplits(tk){const F=secFracs(tk),tr=tk&&tk.trace;if(!tr||!tr.p||tr.p.length<20)return F.map(f=>({f,i:null}));
  const cum=traceCum(tr),L=cum[cum.length-1]||1;return F.map(f=>({f,i:Math.max(0,cum.findIndex(c=>c>=f*L))}))}
function updateSector(){if(!lt.inLap){dev.sd=null;return}const t=now();
  if(!dev.sd||dev.sd.start!==lt.start){let val=null;const nl=lt.laps.length;
    // al traguardo il numero diventa il distacco finale del giro appena chiuso
    const o0=dev.sd;if(nl>=2&&o0&&nl===o0.lapsN+1)val=(lt.lastWasBest?lt.lastMs-lt.prevBest:lt.lastMs-lt.bestMs)/1000;
    // il settore finale si chiude al traguardo: la barra del giro appena finito resta finché non chiudi il primo settore del nuovo
    const o=dev.sd;dev.sdPrev=o&&val!=null&&o.res&&o.res.length===trackSplits(saved.tracks[dev.track]).length?o.res.concat([val-o.lastD]):null;
    dev.sd={start:lt.start,idx:0,val,pred:0,at:val==null?0:t,res:[],lastD:0,lapsN:nl}}
  const sd=dev.sd,sp=trackSplits(saved.tracks[dev.track]),b=lt.best;
  if(!lt.deltaValid||b.length<2)return;const tot=b[b.length-1][0];let moved=false;
  while(sd.idx<sp.length&&lt.curDist>=sp[sd.idx].f*tot){sd.idx++;moved=true;sd.res.push(lt.delta-sd.lastD);sd.lastD=lt.delta}
  if(moved){sd.val=lt.delta;sd.pred=lt.bestMs+lt.delta*1000;sd.at=t}}
// ===================== ingresso GPS (telefono o demo) =====================
function onGeo(lat,lon,acc,spdMs,hdg,t){
  if(!origin)origin={lat,lon};
  const p=toLocal(lat,lon);
  let speed=spdMs!=null&&!isNaN(spdMs)?spdMs*3.6:null,heading=hdg!=null&&!isNaN(hdg)?hdg:null;
  // se il GPS non dà velocità/direzione le ricavo dagli ultimi punti, su una base abbastanza lunga
  // da non scambiare il rumore per movimento (almeno 0,9 s per la velocità, almeno 5 m per la direzione)
  const H=dev.hist||(dev.hist=[]);while(H.length&&t-H[0].t>3000)H.shift();
  if(speed==null){const o=[...H].reverse().find(q=>t-q.t>=900);speed=o?Math.hypot(p.x-o.x,p.y-o.y)/((t-o.t)/1000)*3.6:0}
  if(heading==null||speed<4){const o=[...H].reverse().find(q=>Math.hypot(p.x-q.x,p.y-q.y)>=5);if(o)heading=(Math.atan2(p.x-o.x,p.y-o.y)/D2R+360)%360}
  if(heading==null)heading=dev.lastHd;dev.lastHd=heading;
  H.push({x:p.x,y:p.y,t});
  const valid=acc<25;dev.fix=valid;dev.hAcc=acc;dev.speed=valid?(speed||0):0;dev.lastT=t;dev.lastPerf=now();
  dev.sats=acc<5?13:acc<10?9:acc<25?5:1;
  onFix({t,x:p.x,y:p.y,lat,lon,speedKmh:speed||0,heading,valid});
}
function onFix(f){
  dev.gps=f;
  if(f.valid&&!lt.line&&dev.screen!=='wizard'){
    // una sola pista salvata qui: la scelgo da solo; con più varianti (ovale, TT) scegli tu dalla schermata principale
    const nb=saved.tracks.map((tk,i)=>hav(tk.lat,tk.lon,f.lat,f.lon)<1500?i:-1).filter(i=>i>=0);let bi=nb.length===1?nb[0]:-1;
    if(nb.length)dev.autoDone=true;
    if(bi>=0){useTrack(bi);toast(saved.tracks[bi].name+' riconosciuta')}}
  const dPend=dev.pend?hav(f.lat,f.lon,dev.pend.lat,dev.pend.lon):0;
  if(dev.screen==='wizard'&&dev.wiz===2&&f.valid&&dPend>=8&&f.speedKmh>8){
    // direzione del traguardo = dal punto salvato a dove sei adesso (8-60 m dopo): non dipende dal rumore
    if(dPend<60){const q0=toLocal(dev.pend.lat,dev.pend.lon),hd=(Math.atan2(f.x-q0.x,f.y-q0.y)/D2R+360)%360;
      const tk={lat:dev.pend.lat,lon:dev.pend.lon,heading:hd,width:30};
      // stessa pista (entro 300 m): aggiorno il suo traguardo e tengo nome e record; altrimenti pista nuova
      const wp=saved.tracks[dev.wizPrev];let i=dev.wizFresh?-1:wp&&hav(wp.lat,wp.lon,tk.lat,tk.lon)<300?dev.wizPrev:saved.tracks.findIndex(o=>hav(o.lat,o.lon,tk.lat,tk.lon)<300);
      if(i<0){tk.name=newTrackName();tk.created=Date.now();saved.tracks.push(tk);i=saved.tracks.length-1;dev.wizNew=true}
      else{saved.tracks[i]={...saved.tracks[i],lat:tk.lat,lon:tk.lon,heading:hd};dev.wizNew=false}
      persist();useTrack(i);dev.wiz=3;dev.wizDoneAt=now()}
    else{dev.wiz=1;toast('Troppo lontano dalla linea: riprova')}}
  const ps=lt.start,wi=lt.inLap,lapDone=lt.update(f);
  // punti del giro in corso: al passaggio sul traguardo quelli del giro appena chiuso diventano il suo tracciato
  if(lt.inLap&&(!wi||lt.start!==ps)){dev.donePts=lapDone?dev.lapPts:null;dev.lapPts=[]}
  if(!lt.inLap)dev.lapPts=[];else if(f.valid)(dev.lapPts||(dev.lapPts=[])).push([f.lat,f.lon,f.speedKmh]);
  {const Hd=dev.dHist||(dev.dHist=[]);if(lt.deltaValid){Hd.push([f.t,lt.delta]);while(Hd.length&&f.t-Hd[0][0]>2500)Hd.shift()}else Hd.length=0}
  updateSector();
  if(lapDone){lt.ends.push(Date.now());const tk=saved.tracks[dev.track];dev.trackRec=false;
    if(tk&&(!tk.record||lt.lastMs<tk.record)){dev.trackRec=!!tk.record;dev.oldTrackRec=tk.record||0;tk.record=lt.lastMs;
      const tr=buildTrace(dev.donePts,tk,lt.lastMs);if(tr)tk.trace=tr;applyMinLap();persist()}
    else if(tk&&!tk.trace){const tr=buildTrace(dev.donePts,tk,lt.lastMs);if(tr){tk.trace=tr;persist()}}
    const rec=(lt.lastWasBest&&lt.prevBest>0)||dev.trackRec;if(rec)dev.flashUntil=now()+4500;else dev.lapHl=now()+3000;saveSession()}
}

let watchId=null;
function startPhoneGps(){if(watchId!=null)return;
  if(!('geolocation' in navigator)){dev.geoErr='Questo browser non ha il GPS';return}
  if(!window.isSecureContext){dev.geoErr='Apri l\'app dal suo indirizzo https';return}
  try{watchId=navigator.geolocation.watchPosition(p=>{dev.geoErr=null;if(ble.on)return;const c=p.coords;onGeo(c.latitude,c.longitude,c.accuracy,c.speed,c.heading,p.timestamp)},

  BLE_CTRL='f1a70003-5e4b-4c2a-9d6f-7a3c0de0f00d',BLE_INFO='f1a70004-5e4b-4c2a-9d6f-7a3c0de0f00d';

function decodeBlePos(dv,o=0){const f=dv.getUint8(o+19);return{itow:dv.getUint32(o,true),lat:dv.getInt32(o+4,true)/1e7,lon:dv.getInt32(o+8,true)/1e7,

// ogni punto porta l'ora GPS esatta: la allineo una sola volta all'orologio del telefono, così il ritardo
// del Bluetooth non entra nei tempi e il passaggio al GPS del telefono (se il Bluetooth cade) resta coerente
function bleTime(itow){if(ble.off==null)ble.off=Date.now()-itow-60;else if(ble.last>=0&&itow<ble.last-302400000)ble.off+=604800000;ble.last=itow;return itow+ble.off}

// il Bluetooth del telefono non regge 25 pacchetti al secondo; ognuna ha la sua ora GPS
function onBlePos(e){const dv=e.target.value,pair=dv.byteLength===19,k=pair?2:Math.floor(dv.byteLength/20),n=now();ble.n+=k;ble.pk++;ble.ppp=k;
  if(n-ble.t0>=1000){ble.hz=Math.round(ble.n*1000/(n-ble.t0));ble.pps=Math.round(ble.pk*1000/(n-ble.t0));ble.n=0;ble.pk=0;ble.t0=n}

  for(let i=0;i<k;i++)blePoint(decodeBlePos(dv,i*20),n)}

// la seconda è scritta come spostamento dalla prima; direzione ricavata dal movimento, satelliti dal pacchetto di stato

  try{ble.info=await s.getCharacteristic(BLE_INFO);ble.info.removeEventListener('characteristicvaluechanged',onBleInfo);
    ble.info.addEventListener('characteristicvaluechanged',onBleInfo);await ble.info.startNotifications()}catch(e){}
  ble.pos.removeEventListener('characteristicvaluechanged',onBlePos);ble.pos.addEventListener('characteristicvaluechanged',onBlePos);
  await ble.pos.startNotifications();ble.on=true;ble.t0=now();ble.n=0;stopPhoneGps();

// ---- app Android (APK): il Bluetooth lo gestisce il codice nativo, che passa i pacchetti qui in esadecimale
const NATIVE=typeof ApexNative!=='undefined';
function hexDV(h){const b=new Uint8Array(h.length>>1);for(let i=0;i<b.length;i++)b[i]=parseInt(h.substr(i*2,2),16);return new DataView(b.buffer)}
window.apexBle={
  pos(h){if(ble.on)onBlePos({target:{value:hexDV(h)}})},
  info(h){onBleInfo({target:{value:hexDV(h)}})},
  state(st){
    if(st==='on'){ble.on=true;ble.t0=now();ble.n=0;ble.pk=0;if(saved.source==='ble')stopPhoneGps();
      try{ApexNative.setMode(saved.extMode==null?1:saved.extMode)}catch(e){}toast('GPS esterno collegato')}
    else if(st==='lost'){const was=ble.on;ble.on=false;ble.hz=0;if(saved.source==='ble'){if(was)toast('GPS esterno perso: uso quello del telefono');startPhoneGps()}}
    else if(st==='scan')toast('Cerco il GPS esterno…');
    else if(st==='notfound')toast('GPS esterno non trovato: è acceso?');

    else if(st==='noperm')toast('Serve il permesso per il Bluetooth')}};
// va chiamata da un tocco (il browser apre l'elenco dei dispositivi Bluetooth)
async function bleConnect(){
  if(NATIVE){try{ApexNative.connect()}catch(e){}return}
  if(!navigator.bluetooth){toast('Bluetooth non disponibile: usa Chrome su Android');return}
  if(ble.busy||ble.on)return;ble.busy=true;
  try{if(!ble.dev){ble.dev=await navigator.bluetooth.requestDevice({filters:[{services:[BLE_SVC]}]});ble.dev.addEventListener('gattserverdisconnected',bleLost)}
    await bleAttach()}

function bleAuto(){if(NATIVE){try{ApexNative.connect()}catch(e){}return}try{if(navigator.bluetooth&&navigator.bluetooth.getDevices)navigator.bluetooth.getDevices().then(ds=>{
  const d=ds.find(x=>/ApexLap|FlatTrack/i.test(x.name||''));if(d){ble.dev=d;d.addEventListener('gattserverdisconnected',bleLost);bleRetry()}}).catch(()=>{})}catch(e){}}

// ===================== demo: moto virtuale su ovale =====================
const STR=100,RAD=31.83,PER=2*STR+2*Math.PI*RAD,BASE={lat:44.5,lon:11.3};
function oval(s){s=((s%PER)+PER)%PER;const h=STR/2;
  if(s<h)return{x:s,y:-RAD,hd:90};s-=h;
  if(s<Math.PI*RAD){const a=s/RAD;return{x:h+RAD*Math.sin(a),y:-RAD*Math.cos(a),hd:90-a/D2R}}s-=Math.PI*RAD;
  if(s<STR)return{x:h-s,y:RAD,hd:270};s-=STR;
  if(s<Math.PI*RAD){const a=s/RAD;return{x:-h-RAD*Math.sin(a),y:RAD*Math.cos(a),hd:270-a/D2R}}s-=Math.PI*RAD;
  return{x:-h+s,y:-RAD,hd:90}}
function distToCurve(s){s=((s%PER)+PER)%PER;const h=STR/2,c1=h,c2=h+Math.PI*RAD+STR;
  if(s<c1)return c1-s;if(s<c1+Math.PI*RAD)return 0;if(s<c2)return c2-s;if(s<c2+Math.PI*RAD)return 0;return PER+c1-s}
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const demo={t:1e9,s:-2,v:0,riding:false,pace:1,lapF:1,bx:0,by:0,next:0,hz:1};
function demoStep(dtMs){const vS=26*demo.pace*demo.lapF,vC=18*demo.pace*demo.lapF;let target=0;
  if(demo.riding){const d=distToCurve(demo.s);target=d===0?vC:Math.min(vS,Math.sqrt(vC*vC+14*d))}
  const dt=dtMs/1000,a=target>demo.v?5:-7;demo.v+=a*dt;if((a>0&&demo.v>target)||(a<0&&demo.v<target))demo.v=target;if(demo.v<0)demo.v=0;
  const before=Math.floor(demo.s/PER);demo.s+=demo.v*dt;demo.t+=dtMs;if(Math.floor(demo.s/PER)!==before)demo.lapF=1+(Math.random()-.5)*0.05;
  if(demo.t>=demo.next){demo.next=demo.t+1000/demo.hz;const p=oval(demo.s),sig=1.2;
    demo.bx=Math.max(-2,Math.min(2,demo.bx+gauss()*0.1));demo.by=Math.max(-2,Math.min(2,demo.by+gauss()*0.1));
    const x=p.x+demo.bx+gauss()*sig*0.3,y=p.y+demo.by+gauss()*sig*0.3;
    const lat=BASE.lat+y/R/D2R,lon=BASE.lon+x/(R*Math.cos(BASE.lat*D2R))/D2R;
    onGeo(lat,lon,3+Math.random(),demo.v>0.3?demo.v+gauss()*0.1:0,demo.v>1?p.hd:null,Math.round(demo.t))}}

const SPD_SLOW='#ff453a',SPD_MID='#ffc400';

function traceGeom(tr){const R0=tr.p.map(q=>[q[0]/10,q[1]/10,q[2]]),nP=R0.length;

function shareLaps(L,E,K,date){if(!L.length){toast('Nessun giro da condividere');return}

  tks.forEach(tn=>{let bi=-1;L.forEach((ms,i)=>{if(K[i]===tn&&(bi<0||ms<L[bi]))bi=i});out.push(`${tn}: miglior giro ${fmt(L[bi])}`)});
  T.forEach((t,k)=>{const tl=t.map(i=>L[i]);out.push('',`Turno ${k+1}${tks.length>1?' ('+K[t[0]]+')':''}: ${tl.length} giri, migliore ${fmt(Math.min(...tl))}`);tl.forEach((ms,j)=>out.push(`${j+1}\t${fmt(ms)}`))});

    if(ext){cy=item('Frequenza del GPS esterno','25 Hz solo GPS');
      segmented('sext',x0,cy,w0,ch,[['10 Hz',0],['25 Hz',1]],saved.extMode==null?1:saved.extMode,v=>setExtMode(v))}
    if(ext&&!ble.on)button('sble',x0,y,w0,ch,'Collega GPS esterno',{primary:true,size:20,r:14,act:()=>bleConnect()});
    else info('Segnale',!dev.fix?'Nessun segnale':`Precisione ±${Math.round(dev.hAcc)} m`+(ext&&ble.on&&ble.hz?`, ${ble.hz} Hz`:''),dev.fix?(dev.hAcc<6?C.gainTxt:C.fg):C.lossTxt);
    if(ext&&ble.on)info('Bluetooth',`GPS ${ble.devHz} Hz, arrivano ${ble.hz} punti/s (${ble.pps} pacchetti da ${ble.ppp}${ble.ci?`, ogni ${ble.ci} ms`:''}), fw ${ble.fw}`,C.dim)}
  else if(tab==='gara'){
    let cy=item('Numero grande','anche con un tocco');
    segmented('sview',x0,cy,w0,ch,[['Delta',0],['Tempo del giro',1]],saved.view,v=>{saved.view=v;persist()});
    cy=item('Delta',saved.dmode==='live'?'cambia di continuo':'cambia a ogni settore');
    segmented('sdm',x0,cy,w0,ch,[['Per settore','sec'],['Continuo','live']],saved.dmode==='live'?'live':'sec',v=>{saved.dmode=v;persist()});
    cy=item('Velocità in alto');
    segmented('sspd',x0,cy,w0,ch,[['Nascosta',false],['Visibile',true]],!!saved.showSpeed,v=>{saved.showSpeed=v;persist()})}
  else if(tab==='giri'){const tk=saved.tracks[dev.track],auto=saved.minLapAuto!==false;
    let cy=item('Giro minimo','più brevi ignorati');
    segmented('sminA',x0,cy,w0,ch,[['Automatico',1],['Fisso',0]],auto?1:0,v=>{saved.minLapAuto=!!v;applyMinLap();persist()});
    if(auto)info('Adesso',effMinLap()+' s'+(tk&&tk.record?', metà del record':''));
    cy=item(auto?'Valore fisso, senza record':'Valore fisso');
    button('dmin',x0,cy,72,ch,'',{icon:'down',r:14,act:()=>{saved.minLap=Math.max(4,saved.minLap-1);applyMinLap();persist()}});
    num(saved.minLap+' s',x0+w0/2,cy+ch/2+1,28,C.fg,'center',700);
    button('imin',x0+w0-72,cy,72,ch,'',{icon:'up',r:14,act:()=>{saved.minLap=Math.min(120,saved.minLap+1);applyMinLap();persist()}})}
  else if(tab==='tempi'){
    let cy=item('Precisione','millesimo indicativo');
    segmented('sdec',x0,cy,w0,ch,[['Centesimi',2],['Millesimi',3]],saved.dec===2?2:3,v=>{saved.dec=v;persist()});
    cy=item('Come si scrivono');
    segmented('sfmt',x0,cy,w0,ch,saved.dec===2?[['1:41.58','dot'],["1'41\"58",'apex']]:[['1:41.580','dot'],["1'41\"580",'apex']],saved.tfmt==='apex'?'apex':'dot',v=>{saved.tfmt=v;persist()});
    info('Esempio',fmt(83340))}
  else{
    let cy=item('Colori',(saved.theme||'auto')==='auto'?(isDay()?'ora giorno':'ora sera'):'');
    segmented('sth',x0,cy,w0,ch,[['Automatici','auto'],['Giorno','giorno'],['Sera','sera']],saved.theme||'auto',v=>{saved.theme=v;dayCache.t=0;persist()});
    cy=item('Blocco del miglior giro',saved.pinkHero!==false?'rosa':'semplice');
    segmented('spink',x0,cy,w0,ch,[['Rosa',1],['Semplice',0]],saved.pinkHero!==false?1:0,v=>{saved.pinkHero=!!v;persist()});
    if(instEvt){button('inst',x0,y,w0,ch,'Installa ApexLap',{primary:true,size:20,r:14,act:()=>{const e=instEvt;instEvt=null;e.prompt();e.userChoice.then(r=>toast(r.outcome==='accepted'?'Installata':'Installazione annullata'),()=>{})}})}}}
// ---------- disegno complessivo ----------
function render(){Object.assign(C,isDay()?DAY:NIGHT);document.body.style.background=C.bg;cx.setTransform(scale,0,0,scale,0,0);hits=[];scrollZone=null;zones=[];cx.fillStyle=C.bg;cx.fillRect(0,0,W,H);
  const s=dev.screen;
  if(s==='boot')drawBoot();else if(s==='ready')drawReady();else if(s==='race')drawRace();else if(s==='laps')drawLaps();
  else if(s==='wizard')drawWizard();else if(s==='trackmap')drawTrackMap();else if(s==='settings')drawSettings();else if(s==='tracks')drawTracks();else if(s==='days')drawDays();else if(s==='day')drawDay();
  else if(s==='confirmDayDel'){const d=(saved.days||[])[dev.dayIdx];drawConfirm('Cancellare questa giornata?',d?`${dayName(d.date)}: ${d.laps.length} giri cancellati per sempre`:'','Cancella',()=>{saved.days.splice(dev.dayIdx,1);persist();dev.screen='days';toast('Giornata cancellata')},'day')}
  else if(s==='confirmReset')drawConfirm('Chiudere la giornata?',`I ${todayData().L.length} giri vanno in Giornate, divisi per turno, e oggi riparte da zero`,'Chiudi giornata',()=>{closeDay();dev.screen='ready';toast('Giornata salvata in Giornate')},'laps');
  else if(s==='confirmSwitch')drawConfirm('Cambiare pista?',`I ${lt.laps.length} giri fatti qui restano nella giornata di oggi`,'Cambia pista',()=>{switchTrackKeepDay();useTrack(dev.tsel);dev.screen='ready';toast(saved.tracks[dev.tsel].name+' selezionata')},'tracks');
  else if(s==='confirmDel'){const t=saved.tracks[dev.tsel];drawConfirm(`Cancellare ${t?t.name:'la pista'}?`,t&&t.record?`Si perde anche il record (${fmt(t.record)})`:'Il traguardo salvato viene eliminato','Cancella',()=>{const i=dev.tsel;saved.tracks.splice(i,1);persist();
    if(i===dev.track){lt.clearLine();dev.track=-1}else if(i<dev.track)dev.track--;dev.tsel=Math.min(i,saved.tracks.length-1);dev.screen='tracks';toast('Pista cancellata')},'tracks')}
  if(dev.toast&&now()<dev.toastUntil){cx.font=FL(20,600);const w=cx.measureText(dev.toast).width+44;rr((W-w)/2,SB+12,w,44,14,C.btn);txt(dev.toast,W/2,SB+35,20,C.fg,'center',600)}}

function autoScreens(){const s=dev.screen;
  if(dev.lastT&&now()-dev.lastPerf>4000)dev.fix=false;     // nessun punto GPS da 4 s
  if(s==='boot'&&dev.fix)dev.screen=dev.speed>15?'race':'ready';
  if(['ready','laps','settings','tracks','trackmap','days','day'].includes(s)&&dev.speed>15&&dev.fix)dev.screen='race';
  if(s==='race'){if(dev.fix&&dev.speed<3){if(dev.stillSince==null)dev.stillSince=now();else if(now()-dev.stillSince>3000){dev.screen='ready';dev.stillSince=null;
    // fermo: il giro in corso si annulla (non conta la sosta); quando riparti il giro nuovo parte dal traguardo
    if(lt.inLap){lt.inLap=false;lt.deltaValid=false;dev.lapPts=[];dev.sd=null;toast('Fermo: giro in corso annullato')}}}else dev.stillSince=null}
  if(s==='wizard'&&dev.wiz===3&&now()-dev.wizDoneAt>2500)dev.screen=dev.speed>15?'race':'ready'}

// ===================== tocco =====================
let lastPt={x:0,y:0};
// Chrome offre l'installazione vera (WebAPK, icona senza simbolo di Chrome): la tengo per il pulsante in Opzioni
let instEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e});window.addEventListener('appinstalled',()=>{instEvt=null});
const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
const hitAt=p=>{for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h)return h}return null};
// mappa della pista: un pallino si trascina lungo il tracciato con il dito
function secDragStart(p){const g=dev.mapGeo;if(dev.screen!=='trackmap'||!g)return false;let k=-1,bd=44;
  g.pts.forEach((q,i)=>{if(q){const d=Math.hypot(q[0]-p.x,q[1]-p.y);if(d<bd){bd=d;k=i}}});if(k<0)return false;dev.secDrag={k,moved:false};return true}
function secDragMove(p){const g=dev.mapGeo,sd=dev.secDrag;if(!g||!sd)return;let bj=0,bd=1e9;g.P.forEach((q,j)=>{const d=Math.hypot(g.X(q[0])-p.x,g.Y(q[1])-p.y);if(d<bd){bd=d;bj=j}});
  const L=g.cum[g.cum.length-1]||1,F=secFracs(g.tk).slice(),lo=sd.k?F[sd.k-1]+0.03:0.03,hi=sd.k<F.length-1?F[sd.k+1]-0.03:0.97;
  F[sd.k]=Math.max(lo,Math.min(hi,g.cum[bj]/L));g.tk.sec={n:secCount(g.tk),f:F};sd.moved=true}
cv.addEventListener('pointerdown',e=>{keepAwake();const p=pt(e),h=hitAt(p);pressed=h?h.id:null;try{cv.setPointerCapture(e.pointerId)}catch(x){}
  if(secDragStart(p))return;
  const z=zones.find(q=>p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h)||null;drag=null;if(z&&z.max>0&&p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h){dev[z.key+'V']=0;drag={key:z.key,max:z.max,y0:p.y,s0:dev[z.key]||0,on:false,ly:p.y,lt:performance.now(),v:0}}});
cv.addEventListener('pointermove',e=>{if(dev.secDrag){secDragMove(pt(e));return}if(!drag)return;const p=pt(e),dy=p.y-drag.y0;if(!drag.on&&Math.abs(dy)>10){drag.on=true;pressed=null}
  if(drag.on){const t=performance.now(),dt=Math.max(1,t-drag.lt);drag.v=0.6*drag.v+0.4*(-(p.y-drag.ly)/dt*16.7);drag.ly=p.y;drag.lt=t;
    dev[drag.key]=Math.max(0,Math.min(drag.max,drag.s0-dy))}});
cv.addEventListener('pointerup',e=>{lastPt=pt(e);if(dev.secDrag){const m=dev.secDrag.moved,k=dev.secDrag.k;dev.secDrag=null;if(m){persist();toast(`Fine del settore ${k+1} spostata`)}pressed=null;return}if(drag&&drag.on){if(performance.now()-drag.lt<80)dev[drag.key+'V']=drag.v;drag=null;pressed=null;return}drag=null;
  const h=hitAt(pt(e));if(h&&h.id===pressed){if(h.dis){if(h.id==='wok')toast(dev.speed>5?'Prima fermati':'Aspetta il GPS')}else if(h.act){h.act()}}pressed=null;setTimeout(goFull,50)});
cv.addEventListener('pointercancel',()=>{pressed=null;drag=null;if(dev.secDrag){dev.secDrag=null;persist()}});

// ===================== avvio =====================
resize();keepAwake();
if(saved.source==='demo'){}else{startPhoneGps();if(saved.source==='ble')bleAuto()}
let last=performance.now();
function loop(t){let dt=Math.min(200,t-last);last=t;
  if(stage.clientWidth!==lastVW||stage.clientHeight!==lastVH||innerWidth!==lastIW||innerHeight!==lastIH||!cv.width)resize();
  const ld=document.getElementById('loading');if(ld&&cv.width)ld.remove();
  try{if(saved.source==='demo')while(dt>0){const d=Math.min(5,dt);demoStep(d);dt-=d}}catch(e){window.__errs.push(String(e&&e.message||e))}
  try{autoScreens();render()}catch(e){window.__errs.push(String(e&&e.message||e))}
  if(window.__errs.length){cx.setTransform(scale,0,0,scale,0,0);cx.fillStyle='rgba(120,0,0,.9)';cx.fillRect(0,H-40,W,40);cx.fillStyle='#fff';cx.font='12px sans-serif';cx.textAlign='left';cx.textBaseline='top';
    cx.fillText('ERRORE: '+window.__errs[window.__errs.length-1].slice(0,60),6,H-36);cx.fillText(navigator.userAgent.replace(/.*Chrome\/(\d+).*/,'Chrome $1'),6,H-20)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol==='https:'){let had=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})}
window.__ftt={dev,lt,demo,saved,ble,decodeBlePos,get hits(){return hits},setSource,onGeo};
}
</script>
