<div id="ren" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,15,16,.94);z-index:5;align-items:center;justify-content:center;flex-direction:column;padding:16px;box-sizing:border-box">
  <div style="color:#a1a1a6;font:500 15px 'Barlow',sans-serif;margin-bottom:8px">Nome della pista</div>
  <input id="renIn" maxlength="24" autocomplete="off" style="font:600 24px 'Barlow',sans-serif;width:min(460px,90vw);padding:10px 14px;border-radius:10px;border:1px solid rgba(237,237,237,.12);background:#19191b;color:#ededed;outline:none;caret-color:#ee8fb4">
  <div style="display:flex;margin-top:16px"><button id="renNo" style="font:600 17px 'Barlow',sans-serif;height:40px;min-width:120px;border-radius:8px;border:0;background:transparent;color:#ededed;margin-right:8px">Annulla</button><button id="renOk" style="font:600 17px 'Barlow',sans-serif;height:40px;min-width:120px;border-radius:8px;border:0;background:#ededed;color:#0f0f10">Salva</button></div>

<script>
window.__errs=[];
window.addEventListener('error',e=>{window.__errs.push((e.message||'errore')+' @'+(e.lineno||'?'))});
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}
</script>
<script>
{
// ===================== utilità geografiche =====================
const R=6371000,D2R=Math.PI/180;
const hav=(a,b,c,d)=>{const x=Math.sin((c-a)*D2R/2)**2+Math.cos(a*D2R)*Math.cos(c*D2R)*Math.sin((d-b)*D2R/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};
let origin=null;
const toLocal=(lat,lon)=>({x:(lon-origin.lon)*D2R*R*Math.cos(origin.lat*D2R),y:(lat-origin.lat)*D2R*R});

// ===================== logica giri (come il firmware) =====================
class LapTimer{
  constructor(){this.minLapMs=8000;this.line=null;this.resetSession();this.havePrev=false}
  setLine(l){this.line={...l};const h=l.heading*D2R;this.dx=Math.sin(h);this.dy=Math.cos(h);this.nx=Math.cos(h);this.ny=-Math.sin(h);this.havePrev=false;this.inLap=false}
  clearLine(){this.line=null;this.havePrev=false;this.inLap=false}
  resetSession(){this.prevBest=0;this.inLap=false;this.tr=[];this.best=[];this.laps=[];this.bestMs=0;this.bestNo=0;this.lastMs=0;this.lastWasBest=false;this.deltaValid=false;this.delta=0;this.curDist=0;this.ends=[]}
  crosses(x1,y1,x2,y2){const L=this.line,half=L.width/2,ax=L.x-this.nx*half,ay=L.y-this.ny*half,sx=this.nx*L.width,sy=this.ny*L.width,rx=x2-x1,ry=y2-y1;
    if(rx*this.dx+ry*this.dy<=0)return -1;const den=rx*sy-ry*sx;if(Math.abs(den)<1e-9)return -1;const qx=ax-x1,qy=ay-y1;const t=(qx*sy-qy*sx)/den,u=(qx*ry-qy*rx)/den;return(t>=0&&t<=1&&u>=0&&u<=1)?t:-1}
  update(f){if(!f.valid||!this.line){this.havePrev=false;return false}let done=false;
    if(this.havePrev&&f.t>this.pt){const seg=Math.hypot(f.x-this.px,f.y-this.py),t=this.crosses(this.px,this.py,f.x,f.y),tc=this.pt+Math.round(Math.max(t,0)*(f.t-this.pt));
      if(t>=0&&(!this.inLap||tc-this.start>=this.minLapMs)){
        if(this.inLap){const ms=tc-this.start;this.tr.push([this.curDist+seg*t,ms]);this.laps.push(ms);this.lastMs=ms;this.lastWasBest=!this.bestMs||ms<this.bestMs;
          if(this.lastWasBest){this.prevBest=this.bestMs;this.bestMs=ms;this.bestNo=this.laps.length;this.best=this.tr.slice()}done=true}
        if(!this.inLap&&this.firstStart==null)this.firstStart=tc;this.inLap=true;this.start=tc;this.curDist=seg*(1-t);this.tr=[[0,0],[this.curDist,f.t-tc]];
      }else if(this.inLap){this.curDist+=seg;this.tr.push([this.curDist,f.t-this.start])}}
    this.px=f.x;this.py=f.y;this.pt=f.t;this.havePrev=true;this.computeDelta(f.t);return done}
  computeDelta(t){this.deltaValid=false;const b=this.best;if(!this.inLap||b.length<2||this.curDist>b[b.length-1][0])return;
    let lo=0,hi=b.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(b[m][0]<=this.curDist)lo=m;else hi=m}
    const f=b[hi][0]>b[lo][0]?(this.curDist-b[lo][0])/(b[hi][0]-b[lo][0]):0;this.delta=((t-this.start)-(b[lo][1]+f*(b[hi][1]-b[lo][1])))/1000;this.deltaValid=true}
  cur(t){return this.inLap?Math.max(0,t-this.start):0}
}

// ===================== memoria =====================
const VERSION='v36';const LS='ftt-app-v1';let saved={tracks:[],view:0,minLap:8,source:'phone',session:null,showSpeed:false,theme:'auto',dmode:'sec'};
try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j)saved={...saved,...j}}catch(e){}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(saved))}catch(e){}};
saved.tracks.forEach((t,i)=>{if(!t.name)t.name='Pista '+(i+1)});
const newTrackName=()=>{let k=saved.tracks.length+1;while(saved.tracks.some(t=>t.name==='Pista '+k))k++;return'Pista '+k};
const trackName=()=>dev.track>=0&&saved.tracks[dev.track]?saved.tracks[dev.track].name:'';
function useTrack(i){const tk=saved.tracks[i];if(!tk)return;if(!origin)origin={lat:tk.lat,lon:tk.lon};const q=toLocal(tk.lat,tk.lon);lt.setLine({x:q.x,y:q.y,heading:tk.heading,width:tk.width});dev.track=i;if(saved.lastTrack!==i){saved.lastTrack=i;persist()}applyMinLap()}

if(!saved.viewFix){saved.view=0;saved.viewFix=1;persist()}
const lt=new LapTimer();lt.minLapMs=saved.minLap*1000;
// ---------- turni e giornate ----------
// un turno nuovo quando fra la fine di un giro e l'inizio del successivo passano più di 2 minuti (sosta ai box)
const TURN_GAP=120000;
function turnsOf(L,E){const out=[];for(let i=0;i<L.length;i++){const st=E&&E[i]?E[i]-L[i]:null,prev=E&&i?E[i-1]:null;
  if(!out.length||(st!=null&&prev!=null&&st-prev>TURN_GAP))out.push([]);out[out.length-1].push(i)}return out}
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
// la giornata finita va nell'archivio: si salva da sola, nessun pulsante da ricordare
function archiveSession(){const S=saved.session;if(!S||!S.laps||!S.laps.length)return false;
  (saved.days||(saved.days=[])).unshift({date:S.date,track:S.trackName||((saved.tracks[S.track]||{}).name)||'Pista',laps:S.laps.slice(),ends:(S.ends||[]).slice()});
  if(saved.days.length>300)saved.days.length=300;saved.session=null;persist();return true}
if(saved.session&&saved.session.laps&&saved.session.laps.length&&dayKey(saved.session.date)!==dayKey(Date.now()))archiveSession();
if(saved.session&&saved.session.laps&&saved.session.laps.length){const L=saved.session.laps;lt.laps=L.slice();lt.lastMs=L[L.length-1];
  lt.ends=L.map((_,i)=>(saved.session.ends||[])[i]||null);
  L.forEach((ms,i)=>{if(!lt.bestMs||ms<lt.bestMs){lt.bestMs=ms;lt.bestNo=i+1}})}
const saveSession=()=>{saved.session={laps:lt.laps,ends:lt.ends,track:dev.track,trackName:trackName(),date:new Date().toISOString()};persist()};
function closeDay(){saveSession();const ok=archiveSession();lt.resetSession();saveSession();return ok}
// giro minimo: in automatico metà del record di quella pista (ovale e TT hanno valori diversi da soli)
function effMinLap(){const tk=saved.tracks[dev.track];if(saved.minLapAuto!==false&&tk&&tk.record)return Math.max(4,Math.round(tk.record*0.5/1000));return saved.minLap}
function applyMinLap(){lt.minLapMs=effMinLap()*1000}

const dev={sats:0,fix:false,hAcc:99,speed:0,gps:null,screen:'boot',wiz:0,pend:null,flashUntil:0,stillSince:null,toast:null,toastUntil:0,scroll:0,track:-1,
  lastT:0,lastPerf:0,battery:null,charging:false,geoErr:null,prev:null,lastHd:0,startedAt:performance.now()};
const now=()=>performance.now();
function toast(a,ms=2200){dev.toast=a;dev.toastUntil=now()+ms}
const gpsTime=()=>dev.lastT?dev.lastT+Math.min(1500,now()-dev.lastPerf):0;

// tracciato di un giro: un punto ogni ~1,5 m, in decimetri rispetto al traguardo di allora, con la velocità
function buildTrace(pts,tk,ms){if(!pts||pts.length<10)return null;const o=[tk.lat,tk.lon],kx=R*D2R*Math.cos(o[0]*D2R),ky=R*D2R,out=[];let lx=null,ly=null;
  for(const p of pts){const x=(p[1]-o[1])*kx,y=(p[0]-o[0])*ky;if(lx==null||Math.hypot(x-lx,y-ly)>=1.5){out.push([Math.round(x*10),Math.round(y*10),Math.round(p[2])]);lx=x;ly=y}if(out.length>=2500)break}
  return out.length>=10?{o,p:out,ms,d:Date.now()}:null}
// ===================== settori: tratti uguali da circa 5 secondi l'uno =====================
const splitCache={k:null,v:null};
function trackSplits(tk){const tr=tk&&tk.trace;if(!tr||!tr.p||tr.p.length<20)return null;const key=tr.d+':'+tr.p.length;if(splitCache.k===key)return splitCache.v;
  const p=tr.p,n=p.length,cum=[0];for(let i=1;i<n;i++)cum.push(cum[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1])/10);const L=cum[n-1]||1;
  // il delta si aggiorna circa ogni 5 s di giro: abbastanza spesso da seguirlo, abbastanza fermo da leggerlo con un'occhiata
  const ns=Math.max(3,Math.min(12,Math.round((tr.ms||20000)/5000))),res=[];
  for(let k=1;k<ns;k++){const f=k/ns;res.push({f,i:Math.max(0,cum.findIndex(c=>c>=f*L))})}
  splitCache.k=key;splitCache.v=res;return res}
function updateSector(){if(!lt.inLap){dev.sd=null;return}const t=now();
  if(!dev.sd||dev.sd.start!==lt.start){let val=null;const nl=lt.laps.length;
    // al traguardo il numero diventa il distacco finale del giro appena chiuso
    if(nl>=2)val=(lt.lastWasBest?lt.lastMs-lt.prevBest:lt.lastMs-lt.bestMs)/1000;
    dev.sd={start:lt.start,idx:0,val,pred:0,at:val==null?0:t}}
  const sd=dev.sd,sp=trackSplits(saved.tracks[dev.track])||[1,2,3].map(k=>({f:k/4})),b=lt.best;
  if(!lt.deltaValid||b.length<2)return;const tot=b[b.length-1][0];let moved=false;
  while(sd.idx<sp.length&&lt.curDist>=sp[sd.idx].f*tot){sd.idx++;moved=true}
  if(moved){sd.val=lt.delta;sd.pred=lt.bestMs+lt.delta*1000;sd.at=t}}
// ===================== ingresso GPS (telefono o demo) =====================
function onGeo(lat,lon,acc,spdMs,hdg,t){
  if(!origin)origin={lat,lon};
  const p=toLocal(lat,lon);
  let speed=spdMs!=null&&!isNaN(spdMs)?spdMs*3.6:null,heading=hdg!=null&&!isNaN(hdg)?hdg:null;
  // se il GPS non dà velocità/direzione le ricavo dagli ultimi punti, su una base abbastanza lunga
  // da non scambiare il rumore per movimento (almeno 0,9 s per la velocità, almeno 5 m per la direzione)
  const H=dev.hist||(dev.hist=[]);while(H.length&&t-H[0].t>3000)H.shift();
  if(speed==null){const o=[...H].reverse().find(q=>t-q.t>=900);speed=o?Math.hypot(p.x-o.x,p.y-o.y)/((t-o.t)/1000)*3.6:0}
  if(heading==null||speed<4){const o=[...H].reverse().find(q=>Math.hypot(p.x-q.x,p.y-q.y)>=5);if(o)heading=(Math.atan2(p.x-o.x,p.y-o.y)/D2R+360)%360}
  if(heading==null)heading=dev.lastHd;dev.lastHd=heading;
  H.push({x:p.x,y:p.y,t});
  const valid=acc<25;dev.fix=valid;dev.hAcc=acc;dev.speed=valid?(speed||0):0;dev.lastT=t;dev.lastPerf=now();
  dev.sats=acc<5?13:acc<10?9:acc<25?5:1;
  onFix({t,x:p.x,y:p.y,lat,lon,speedKmh:speed||0,heading,valid});
}
function onFix(f){
  dev.gps=f;
  if(f.valid&&!lt.line&&dev.screen!=='wizard'){
    let bi=-1,bd=1500;saved.tracks.forEach((tk,i)=>{const d=hav(tk.lat,tk.lon,f.lat,f.lon);if(d<bd){bd=d;bi=i}});
    // varianti nello stesso posto: vince l'ultima usata
    const lu=saved.tracks[saved.lastTrack];if(bi>=0&&lu&&hav(lu.lat,lu.lon,f.lat,f.lon)<1500)bi=saved.lastTrack;
    if(bi>=0){useTrack(bi);toast(saved.tracks[bi].name+' riconosciuta')}}
  const dPend=dev.pend?hav(f.lat,f.lon,dev.pend.lat,dev.pend.lon):0;
  if(dev.screen==='wizard'&&dev.wiz===2&&f.valid&&dPend>=8&&f.speedKmh>8){
    // direzione del traguardo = dal punto salvato a dove sei adesso (8-60 m dopo): non dipende dal rumore
    if(dPend<60){const q0=toLocal(dev.pend.lat,dev.pend.lon),hd=(Math.atan2(f.x-q0.x,f.y-q0.y)/D2R+360)%360;
      const tk={lat:dev.pend.lat,lon:dev.pend.lon,heading:hd,width:30};
      // stessa pista (entro 300 m): aggiorno il suo traguardo e tengo nome e record; altrimenti pista nuova
      const wp=saved.tracks[dev.wizPrev];let i=dev.wizFresh?-1:wp&&hav(wp.lat,wp.lon,tk.lat,tk.lon)<300?dev.wizPrev:saved.tracks.findIndex(o=>hav(o.lat,o.lon,tk.lat,tk.lon)<300);
      if(i<0){tk.name=newTrackName();tk.created=Date.now();saved.tracks.push(tk);i=saved.tracks.length-1;dev.wizNew=true}
      else{saved.tracks[i]={...saved.tracks[i],lat:tk.lat,lon:tk.lon,heading:hd};dev.wizNew=false}
      persist();useTrack(i);dev.wiz=3;dev.wizDoneAt=now()}
    else{dev.wiz=1;toast('Troppo lontano dalla linea: riprova')}}
  const ps=lt.start,wi=lt.inLap,lapDone=lt.update(f);
  // punti del giro in corso: al passaggio sul traguardo quelli del giro appena chiuso diventano il suo tracciato
  if(lt.inLap&&(!wi||lt.start!==ps)){dev.donePts=lapDone?dev.lapPts:null;dev.lapPts=[]}
  if(!lt.inLap)dev.lapPts=[];else if(f.valid)(dev.lapPts||(dev.lapPts=[])).push([f.lat,f.lon,f.speedKmh]);
  {const Hd=dev.dHist||(dev.dHist=[]);if(lt.deltaValid){Hd.push([f.t,lt.delta]);while(Hd.length&&f.t-Hd[0][0]>2500)Hd.shift()}else Hd.length=0}
  updateSector();
  if(lapDone){lt.ends.push(Date.now());const tk=saved.tracks[dev.track];dev.trackRec=false;
    if(tk&&(!tk.record||lt.lastMs<tk.record)){dev.trackRec=!!tk.record;dev.oldTrackRec=tk.record||0;tk.record=lt.lastMs;
      const tr=buildTrace(dev.donePts,tk,lt.lastMs);if(tr)tk.trace=tr;applyMinLap();persist()}
    else if(tk&&!tk.trace){const tr=buildTrace(dev.donePts,tk,lt.lastMs);if(tr){tk.trace=tr;persist()}}
    const rec=(lt.lastWasBest&&lt.prevBest>0)||dev.trackRec;if(rec)dev.flashUntil=now()+4500;else dev.lapHl=now()+3000;saveSession();try{navigator.vibrate&&navigator.vibrate(rec?[80,60,80,60,80]:60)}catch(e){}}
}

let watchId=null;
function startPhoneGps(){if(watchId!=null)return;
  if(!('geolocation' in navigator)){dev.geoErr='Questo browser non ha il GPS';return}
  if(!window.isSecureContext){dev.geoErr='Apri l\'app dal suo indirizzo https';return}
  try{watchId=navigator.geolocation.watchPosition(p=>{dev.geoErr=null;if(ble.on)return;const c=p.coords;onGeo(c.latitude,c.longitude,c.accuracy,c.speed,c.heading,p.timestamp)},
    e=>{dev.geoErr=e.code===1?'Permesso posizione negato':'GPS non disponibile';},{enableHighAccuracy:true,maximumAge:0,timeout:10000})}catch(e){dev.geoErr='GPS non disponibile qui'}}
function stopPhoneGps(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}}

// ===================== GPS esterno via Bluetooth (ESP32-C3 + u-blox M10, firmware ApexLapGPS) =====================
const BLE_SVC='f1a70001-5e4b-4c2a-9d6f-7a3c0de0f00d',BLE_POS='f1a70002-5e4b-4c2a-9d6f-7a3c0de0f00d',
  BLE_CTRL='f1a70003-5e4b-4c2a-9d6f-7a3c0de0f00d',BLE_INFO='f1a70004-5e4b-4c2a-9d6f-7a3c0de0f00d';
const ble={dev:null,pos:null,ctrl:null,info:null,on:false,busy:false,hz:0,n:0,t0:0,off:null,last:-1,sv:0,state:0,devHz:0,fw:0};
// pacchetto da 20 byte: ora GPS, lat, lon, velocità, direzione, precisione, satelliti, fix
function decodeBlePos(dv){const f=dv.getUint8(19);return{itow:dv.getUint32(0,true),lat:dv.getInt32(4,true)/1e7,lon:dv.getInt32(8,true)/1e7,
  spd:dv.getUint16(12,true)/100,hdg:dv.getUint16(14,true)/100,acc:dv.getUint16(16,true)/100,sv:dv.getUint8(18),fix:f&7,ok:!!(f&8)}}
// ogni punto porta l'ora GPS esatta: la allineo una sola volta all'orologio del telefono, così il ritardo
// del Bluetooth non entra nei tempi e il passaggio al GPS del telefono (se il Bluetooth cade) resta coerente
function bleTime(itow){if(ble.off==null)ble.off=Date.now()-itow-60;else if(ble.last>=0&&itow<ble.last-302400000)ble.off+=604800000;ble.last=itow;return itow+ble.off}
function onBlePos(e){const p=decodeBlePos(e.target.value),n=now();ble.n++;if(n-ble.t0>=1000){ble.hz=Math.round(ble.n*1000/(n-ble.t0));ble.n=0;ble.t0=n}
  if(saved.source!=='ble')return;
  const t=bleTime(p.itow);ble.sv=p.sv;
  if(!(p.ok&&p.fix>=3)){dev.fix=false;dev.hAcc=99;dev.sats=p.sv;dev.lastT=t;dev.lastPerf=n;return}
  onGeo(p.lat,p.lon,Math.max(0.3,p.acc),p.spd,p.spd>1.5?p.hdg:null,t);dev.sats=p.sv}
function onBleInfo(e){const d=e.target.value;if(d.byteLength>=6){ble.fw=d.getUint8(0);ble.devHz=d.getUint8(2);ble.state=d.getUint8(3)}}
async function bleAttach(){const srv=await ble.dev.gatt.connect(),s=await srv.getPrimaryService(BLE_SVC);

  return{x:-h+s,y:-RAD,hd:90}}

function numMetrics(t,size,w){cx.font=FN(size,w);let dw=0;for(const d of '0123456789')dw=Math.max(dw,cx.measureText(d).width);
  let tot=0;for(const ch of t)tot+=isDig(ch)?dw:cx.measureText(ch).width;return{tot,dw}}
// numero con cifre a larghezza fissa: non "balla" mentre scorre
function num(t,x,y,size,col,al='center',w=700,maxW=1e9){let m=numMetrics(t,size,w);while(m.tot>maxW&&size>10){size-=2;m=numMetrics(t,size,w)}
  let sx=al==='center'?x-m.tot/2:al==='right'?x-m.tot:x;cx.fillStyle=col;cx.textBaseline='middle';cx.textAlign='center';
  for(const ch of t){const cw=isDig(ch)?m.dw:cx.measureText(ch).width;cx.fillText(ch,sx+cw/2,y);sx+=cw}return m.tot}
function rr(x,y,w,h,r,fill,stroke,lw=1){cx.beginPath();cx.roundRect(x,y,w,h,r);if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw;cx.stroke()}}
const hline=(x,y,w,col)=>{cx.fillStyle=col;cx.fillRect(x,y,w,1)};
const mix=(a,b,k)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),A=p(a),B=p(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`};

// ---------- icone vettoriali (riquadro s×s centrato in x,y) ----------
function icon(name,x,y,s,col){cx.save();cx.translate(x,y);cx.strokeStyle=col;cx.fillStyle=col;cx.lineWidth=Math.max(1.6,s/9);cx.lineCap='round';cx.lineJoin='round';const h=s/2;cx.beginPath();
  switch(name){
    case'copy':cx.strokeRect(-h*0.75,-h*0.45,h*1.1,h*1.2);cx.beginPath();cx.moveTo(-h*0.35,-h*0.75);cx.lineTo(h*0.75,-h*0.75);cx.lineTo(h*0.75,h*0.4);cx.stroke();break;
    case'laps':for(let i=-1;i<=1;i++){cx.moveTo(-h*0.35,i*h*0.6);cx.lineTo(h,i*h*0.6);cx.moveTo(-h,i*h*0.6);cx.arc(-h*0.8,i*h*0.6,1,0,7)}cx.stroke();break;
    case'pin':cx.arc(0,-h*0.25,h*0.55,Math.PI*0.85,Math.PI*2.15);cx.lineTo(0,h);cx.closePath();cx.stroke();cx.beginPath();cx.arc(0,-h*0.25,h*0.18,0,7);cx.fill();break;
    case'gear':for(let i=0;i<8;i++){const a=i*Math.PI/4;cx.moveTo(Math.cos(a)*h*0.62,Math.sin(a)*h*0.62);cx.lineTo(Math.cos(a)*h*0.95,Math.sin(a)*h*0.95)}cx.stroke();cx.beginPath();cx.arc(0,0,h*0.6,0,7);cx.stroke();cx.beginPath();cx.arc(0,0,h*0.22,0,7);cx.stroke();break;
    case'flag':cx.moveTo(-h*0.75,h);cx.lineTo(-h*0.75,-h);cx.stroke();for(let r=0;r<3;r++)for(let c=0;c<3;c++)if((r+c)%2===0)cx.fillRect(-h*0.75+c*h*0.55,-h+r*h*0.4,h*0.55,h*0.4);cx.strokeRect(-h*0.75,-h,h*1.65,h*1.2);break;
    case'back':cx.moveTo(h*0.35,-h*0.75);cx.lineTo(-h*0.4,0);cx.lineTo(h*0.35,h*0.75);cx.stroke();break;
    case'up':cx.moveTo(-h*0.7,h*0.35);cx.lineTo(0,-h*0.4);cx.lineTo(h*0.7,h*0.35);cx.stroke();break;
    case'down':cx.moveTo(-h*0.7,-h*0.35);cx.lineTo(0,h*0.4);cx.lineTo(h*0.7,-h*0.35);cx.stroke();break;
    case'share':cx.moveTo(0,h*0.25);cx.lineTo(0,-h);cx.moveTo(-h*0.45,-h*0.55);cx.lineTo(0,-h);cx.lineTo(h*0.45,-h*0.55);cx.moveTo(-h*0.35,-h*0.2);cx.lineTo(-h*0.8,-h*0.2);cx.lineTo(-h*0.8,h);cx.lineTo(h*0.8,h);cx.lineTo(h*0.8,-h*0.2);cx.lineTo(h*0.35,-h*0.2);cx.stroke();break;
    case'edit':cx.moveTo(-h*0.8,h*0.8);cx.lineTo(-h*0.65,h*0.25);cx.lineTo(h*0.45,-h*0.85);cx.lineTo(h*0.85,-h*0.45);cx.lineTo(-h*0.25,h*0.65);cx.closePath();cx.stroke();break;
    case'trash':cx.moveTo(-h*0.85,-h*0.55);cx.lineTo(h*0.85,-h*0.55);cx.moveTo(-h*0.3,-h*0.55);cx.lineTo(-h*0.25,-h*0.9);cx.lineTo(h*0.25,-h*0.9);cx.lineTo(h*0.3,-h*0.55);cx.moveTo(-h*0.6,-h*0.55);cx.lineTo(-h*0.45,h*0.9);cx.lineTo(h*0.45,h*0.9);cx.lineTo(h*0.6,-h*0.55);cx.stroke();break;
    case'map':cx.moveTo(-h*0.75,h*0.6);cx.lineTo(-h*0.15,-h*0.25);cx.lineTo(h*0.2,h*0.3);cx.lineTo(h*0.75,-h*0.6);cx.stroke();cx.beginPath();cx.arc(-h*0.75,h*0.6,h*0.2,0,7);cx.fill();cx.beginPath();cx.arc(h*0.75,-h*0.6,h*0.2,0,7);cx.fill();break;
    case'plus':cx.moveTo(0,-h*0.8);cx.lineTo(0,h*0.8);cx.moveTo(-h*0.8,0);cx.lineTo(h*0.8,0);cx.stroke();break;
    case'check':cx.moveTo(-h*0.8,0);cx.lineTo(-h*0.2,h*0.6);cx.lineTo(h*0.85,-h*0.6);cx.stroke();break;
    case'play':cx.moveTo(-h*0.5,-h*0.8);cx.lineTo(h*0.8,0);cx.lineTo(-h*0.5,h*0.8);cx.closePath();cx.fill();break;
    case'arrowR':cx.moveTo(-h,0);cx.lineTo(h*0.8,0);cx.moveTo(h*0.2,-h*0.6);cx.lineTo(h*0.85,0);cx.lineTo(h*0.2,h*0.6);cx.stroke();break;
  }cx.restore()}

// ---------- pulsanti ----------
// riquadro a filo sottile con etichetta incastrata nel bordo superiore (sx) ed eventuale valore a destra
// stile minimale: nessun contorno, solo una piccola etichetta sopra il contenuto (a destra un'eventuale nota)
function panel(x,y,w,h,label,labelR,col,colR){const lc=(col&&col!==C.line&&col!==C.frame)?col:C.dim;
  if(label)txt(label,x+6,y+4,12,lc,'left',600);if(labelR)txt(labelR,x+w-6,y+4,12,colR||lc,'right',600)}
function button(id,x,y,w,h,label,opt={}){const down=pressed===id,dis=opt.disabled;
  let bg=down?C.btnDown:C.btn,fg=dis?C.faint:C.fg;
  if(opt.primary&&!dis){bg=down?C.dim:C.fg;fg=C.bg}
  else if(opt.danger){fg=C.lossTxt}
  else if(opt.ghost){bg=down?C.btnDown:null}
  if(dis&&!opt.ghost)bg=C.surface;
  if(bg)rr(x,y,w,h,8,bg);
  const size=opt.size||17,ic=opt.icon,isz=Math.min(18,h*0.42);
  if(opt.sub){const cxm=x+w/2;if(ic)icon(ic,cxm,y+h*0.32,isz,dis?C.faint:C.accentTxt);
    fitT(label,cxm,ic?y+h*0.62:y+h/2-7,size,fg,w-12,'center',700);fitT(opt.sub,cxm,ic?y+h*0.84:y+h/2+11,12,C.dim,w-12,'center',500)}
  else{cx.font=FL(size,700);const lw=label?Math.min(cx.measureText(label).width,w-(ic?isz+22:14)):0,gap=ic&&label?8:0,tot=(ic?isz:0)+gap+lw,sx=x+(w-tot)/2;
    if(ic)icon(ic,sx+isz/2,y+h/2,isz,fg);if(label)fitT(label,sx+(ic?isz+gap:0),y+h/2+1,size,fg,w-(ic?isz+22:14),'left',700)}
  hits.push({id,x,y,w,h,act:opt.act,dis})}
// controllo segmentato (opzioni alternative)
function segmented(id,x,y,w,h,opts,cur,set){const n=opts.length,sw=w/n;rr(x,y,w,h,8,C.surface);
  opts.forEach(([l,v],k)=>{const sx=x+k*sw,sel=cur===v;if(sel)rr(sx+3,y+3,sw-6,h-6,6,C.btn);
    fitT(l,sx+sw/2,y+h/2+1,15,sel?C.accentTxt:C.dim,sw-8,'center',sel?600:500);hits.push({id:id+k,x:sx,y,w:sw,h,act:()=>set(v)})})}

const pad2=v=>String(v).padStart(2,'0');
// tempo sul giro: 1:24.234 (millesimi) oppure 1:24.23 (centesimi) a scelta nelle opzioni
function fmt(ms){if(!ms&&ms!==0)return'--';ms=Math.max(0,Math.round(ms));const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,
  fr=saved.dec===2?pad2(Math.floor(ms%1000/10)):String(ms%1000).padStart(3,'0');
  if(saved.tfmt==='apex')return m>0?`${m}'${pad2(s)}"${fr}`:`${s}"${fr}`;
  return m>0?`${m}:${pad2(s)}.${fr}`:`${s}.${fr}`}
// tempo che scorre in gara: decimi, così le cifre non "frullano"
const fmt1=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,d=Math.floor(ms%1000/100);return m>0?`${m}:${pad2(s)}.${d}`:`${s}.${d}`};
// distacco tra giri chiusi, con la stessa precisione dei tempi
const gap=v=>(v<0?'−':'+')+Math.abs(v).toFixed(saved.dec===2?2:3);
const sgn=v=>(v<0?'−':'+')+Math.abs(v).toFixed(2);

// ---------- mappa della pista ----------
const SPD_SLOW='#ff453a',SPD_MID='#ffc400';
function spdCol(k){const fast=C.gain;return k<0.5?mix(SPD_SLOW,SPD_MID,k*2):mix(SPD_MID,fast,(k-0.5)*2)}
function traceGeom(tr){const R0=tr.p.map(q=>[q[0]/10,q[1]/10,q[2]]),nP=R0.length;
  // media mobile su 5 punti solo per il disegno (i dati salvati restano quelli misurati); il giro è chiuso
  const P=R0.map((q,i)=>{let sx=0,sy=0;for(let k=-2;k<=2;k++){const r=R0[(i+k+nP)%nP];sx+=r[0];sy+=r[1]}return[sx/5,sy/5,q[2]]});
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,v0=1e9,v1=0,len=0;
  P.forEach((q,i)=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);v0=Math.min(v0,q[2]);v1=Math.max(v1,q[2]);
    if(i)len+=Math.hypot(q[0]-P[i-1][0],q[1]-P[i-1][1])});
  return{P,x0,x1,y0,y1,v0,v1,len}}
// miniatura della pista dentro un riquadro (x,y,w,h)
function drawTraceMini(tk,x,y,w,h){const tr=tk.trace,g=traceGeom(tr),sc=Math.min((w-8)/Math.max(1,g.x1-g.x0),(h-8)/Math.max(1,g.y1-g.y0)),
  ox=x+w/2-(g.x0+g.x1)/2*sc,oy=y+h/2+(g.y0+g.y1)/2*sc,vr=Math.max(1,g.v1-g.v0);
  cx.lineCap='round';cx.lineJoin='round';
  for(let i=1;i<g.P.length;i++){cx.beginPath();cx.moveTo(ox+g.P[i-1][0]*sc,oy-g.P[i-1][1]*sc);cx.lineTo(ox+g.P[i][0]*sc,oy-g.P[i][1]*sc);
    cx.strokeStyle=spdCol((g.P[i][2]-g.v0)/vr);cx.lineWidth=2.5;cx.stroke()}
  const kx=R*D2R*Math.cos(tr.o[0]*D2R),ky=R*D2R;cx.beginPath();cx.arc(ox+(tk.lon-tr.o[1])*kx*sc,oy-(tk.lat-tr.o[0])*ky*sc,4,0,7);cx.fillStyle=C.accent;cx.fill()}
function drawTrackMap(){statusBar('','');const tk=saved.tracks[dev.tsel],tr=tk&&tk.trace;
  header(tk?tk.name:'Pista',()=>dev.screen='tracks','');
  const top=SB+44;
  if(!tr){icon('map',W/2,top+46,26,C.faint);txt('Nessun tracciato per questa pista',W/2,top+82,18,C.fg,'center',700);
    txt('Si salva da solo quando fai un giro completo, e si aggiorna a ogni nuovo record',W/2,top+106,13,C.dim,'center',500);return}
  const{P,x0,x1,y0,y1,v0,v1,len}=traceGeom(tr);
  const side=Math.min(170,W*0.32),mw=W-side-20,mh=H-top-30,mx=10,my=top,sc=Math.min((mw-30)/Math.max(1,x1-x0),(mh-30)/Math.max(1,y1-y0)),
    ox=mx+mw/2-(x0+x1)/2*sc,oy=my+mh/2+(y0+y1)/2*sc,X=x=>ox+x*sc,Y=y=>oy-y*sc,vr=Math.max(1,v1-v0);
  // pista: bordo neutro sotto, tratti colorati per velocità sopra
  cx.lineCap='round';cx.lineJoin='round';cx.beginPath();P.forEach((q,i)=>i?cx.lineTo(X(q[0]),Y(q[1])):cx.moveTo(X(q[0]),Y(q[1])));
  cx.strokeStyle=C.off;cx.lineWidth=9;cx.stroke();
  for(let i=1;i<P.length;i++){cx.beginPath();cx.moveTo(X(P[i-1][0]),Y(P[i-1][1]));cx.lineTo(X(P[i][0]),Y(P[i][1]));
    cx.strokeStyle=spdCol((P[i][2]-v0)/vr);cx.lineWidth=4;cx.stroke()}
  // traguardo (posizione attuale della pista, riportata nel riferimento del tracciato) con il senso di marcia
  const kx=R*D2R*Math.cos(tr.o[0]*D2R),ky=R*D2R,sx=X((tk.lon-tr.o[1])*kx),sy=Y((tk.lat-tr.o[0])*ky),h=tk.heading*D2R,dx=Math.sin(h),dy=-Math.cos(h),nx=-dy,ny=dx;
  cx.beginPath();cx.moveTo(sx-nx*13,sy-ny*13);cx.lineTo(sx+nx*13,sy+ny*13);cx.strokeStyle=C.fg;cx.lineWidth=2;cx.stroke();cx.beginPath();cx.arc(sx,sy,5,0,7);cx.fillStyle=C.accent;cx.fill();
  const ax=sx+dx*16,ay=sy+dy*16;cx.beginPath();cx.moveTo(ax+dx*7,ay+dy*7);cx.lineTo(ax-dx*3+nx*5,ay-dy*3+ny*5);cx.lineTo(ax-dx*3-nx*5,ay-dy*3-ny*5);cx.closePath();cx.fillStyle=C.fg;cx.fill();
  {const sp=trackSplits(tk);if(sp)sp.forEach(q=>{const pt=P[Math.min(P.length-1,q.i)];if(!pt)return;cx.beginPath();cx.arc(X(pt[0]),Y(pt[1]),5,0,7);cx.fillStyle=C.bg;cx.fill();cx.lineWidth=2;cx.strokeStyle=C.fg;cx.stroke()})}
  // legenda velocità
  const ly=H-14,lx0=mx+60,lw=mw-120;for(let i=0;i<lw;i+=2){cx.fillStyle=spdCol(i/lw);cx.fillRect(lx0+i,ly-3,2,6)}
  num(Math.round(v0)+'',lx0-8,ly,13,C.dim,'right',600);num(Math.round(v1)+' km/h',lx0+lw+8,ly,13,C.dim,'left',600);
  // dati a destra
  const rx=W-side+4,rows=[['Lunghezza',Math.round(len)+' m'],['Tempo del giro',fmt(tr.ms)],['Velocità massima',Math.round(v1)+' km/h'],['Velocità minima',Math.round(v0)+' km/h']];
  rows.forEach(([l,v],i)=>{const y=top+12+i*37;txt(l,rx,y,12,C.dim,'left',600);num(v,rx,y+16,20,i===1?C.gainTxt:C.fg,'left',700,side-16);if(i<3)hline(rx,y+28,side-16,C.line)});
  const d=new Date(tr.d);txt('Registrato il '+d.toLocaleDateString('it-IT',{day:'numeric',month:'short'}),rx,H-14,11,C.faint,'left',500)}

// ---------- conferme ----------
function drawConfirm(title,sub,yesLbl,act,back='ready'){statusBar('','');
  fitT(title,W/2,SB+56,26,C.fg,W-30,'center',700);fitT(sub,W/2,SB+86,14,C.dim,W-30,'center',500);
  const bw=Math.min(180,(W-44)/2);
  button('no',W/2-bw-6,H-60,bw,40,'Annulla',{ghost:true,act:()=>dev.screen=back,size:16});
  button('yes',W/2+6,H-60,bw,40,yesLbl,{danger:true,act,size:16})}

function shareLaps(L,E,track,date){if(!L.length){toast('Nessun giro da condividere');return}
  let bi=0;L.forEach((ms,i)=>{if(ms<L[bi])bi=i});const T=turnsOf(L,E),out=[`ApexLap, ${dayName(date)}`,track||'Pista',`Miglior giro: ${fmt(L[bi])} (${lapLabel(bi,L,E)})`];
  T.forEach((t,k)=>{const tl=t.map(i=>L[i]);out.push('',T.length>1?`Turno ${k+1}: ${tl.length} giri, migliore ${fmt(Math.min(...tl))}`:`${tl.length} giri`);tl.forEach((ms,j)=>out.push(`${j+1}\t${fmt(ms)}`))});
  const lines=out.join('\n');
  if(navigator.share)navigator.share({title:'Giri',text:lines}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(lines).then(()=>toast('Giri copiati'),()=>toast('Impossibile condividere'))}

// ---------- opzioni ----------
function drawSettings(){statusBar('','');header('Opzioni',()=>dev.screen='ready',VERSION);
  const top=SB+41,rh=36,cw=Math.min(240,W-150),cx0=W-12-cw,ext=saved.source==='ble',nRows=ext?10:9,ah=H-top,content=nRows*rh+4;
  const off=listArea('sscroll',0,top,W,ah,content),h0=hits.length;let i=0;
  const row=(lbl,hint)=>{const y=top+1+i*rh-off;txt(lbl,14,y+rh/2-(hint?6:0),16,C.fg,'left',600);if(hint)txt(hint,14,y+rh/2+9,11,C.dim,'left',500);
    if(i<nRows-1)hline(12,y+rh,W-24,C.line);i++;return y+4};
  let y=row('GPS',ext?(ble.on?('esterno collegato'+(ble.hz?', '+ble.hz+' punti al secondo':'')):'esterno non collegato: tocca Esterno'):'');
  segmented('sgps',cx0,y,cw,rh-8,[['Telefono','phone'],['Esterno','ble'],['Demo','demo']],saved.source,
    v=>{if(v==='ble'&&saved.source==='ble'){bleConnect();return}if(saved.source!==v){setSource(v);resize()}});
  if(ext){y=row('Frequenza GPS esterno','25 Hz usa solo i satelliti GPS');
    segmented('sext',cx0,y,cw,rh-8,[['10 Hz',0],['25 Hz',1]],saved.extMode==null?1:saved.extMode,v=>setExtMode(v))}
  {const tk=saved.tracks[dev.track],auto=saved.minLapAuto!==false;
  y=row('Giro minimo',auto?(tk&&tk.record?`metà del record di questa pista: ${effMinLap()} s`:'metà del record della pista'):'uguale per tutte le piste');
  segmented('sminA',cx0,y,cw,rh-8,[['Auto',1],['Manuale',0]],auto?1:0,v=>{saved.minLapAuto=!!v;applyMinLap();persist()});
  y=row(auto?'Giro minimo senza record':'Giro minimo manuale','sotto, il passaggio viene ignorato')}
  button('dmin',cx0,y,44,rh-8,'',{icon:'down',act:()=>{saved.minLap=Math.max(4,saved.minLap-1);applyMinLap();persist()}});
  num(saved.minLap+' s',cx0+cw/2,y+(rh-8)/2+1,18,C.fg,'center',700);
  button('imin',cx0+cw-44,y,44,rh-8,'',{icon:'up',act:()=>{saved.minLap=Math.min(120,saved.minLap+1);applyMinLap();persist()}});
  y=row('Vista in gara');segmented('sview',cx0,y,cw,rh-8,[['Delta',0],['Tempo',1]],saved.view,v=>{saved.view=v;persist()});
  y=row('Delta in gara',saved.dmode==='live'?'cambia di continuo':'cambia circa ogni 5 secondi');
  segmented('sdm',cx0,y,cw,rh-8,[['Per settore','sec'],['Continuo','live']],saved.dmode==='live'?'live':'sec',v=>{saved.dmode=v;persist()});
  y=row('Decimali dei tempi',(saved.dec===2?'19.75':'19.750')+', il millesimo è indicativo');
  segmented('sdec',cx0,y,cw,rh-8,[['Centesimi',2],['Millesimi',3]],saved.dec===2?2:3,v=>{saved.dec=v;persist()});
  y=row('Formato dei tempi',saved.tfmt==='apex'?'stile cronometrista':'stile digitale');
  segmented('sfmt',cx0,y,cw,rh-8,saved.dec===2?[['1:41.58','dot'],["1'41\"58",'apex']]:[['1:41.580','dot'],["1'41\"580",'apex']],saved.tfmt==='apex'?'apex':'dot',v=>{saved.tfmt=v;persist()});
  y=row('Velocità in gara');segmented('sspd',cx0,y,cw,rh-8,[['Nascosta',false],['Visibile',true]],!!saved.showSpeed,v=>{saved.showSpeed=v;persist()});
  y=row('Schermo',(saved.theme||'auto')==='auto'?(isDay()?'ora giorno':'ora sera'):'');
  segmented('sth',cx0,y,cw,rh-8,[['Auto','auto'],['Giorno','giorno'],['Sera','sera']],saved.theme||'auto',v=>{saved.theme=v;dayCache.t=0;persist()});
  endList('sscroll',0,top,W,ah,content);
  // si toccano solo le righe visibili, non quelle scorse sotto l'intestazione
  hits=hits.slice(0,h0).concat(hits.slice(h0).filter(h=>h.y+h.h/2>top&&h.y+h.h/2<H))}

// ---------- disegno complessivo ----------
function render(){Object.assign(C,isDay()?DAY:NIGHT);document.body.style.background=C.bg;cx.setTransform(scale,0,0,scale,0,0);hits=[];scrollZone=null;cx.fillStyle=C.bg;cx.fillRect(0,0,W,H);
  const s=dev.screen;
  if(s==='boot')drawBoot();else if(s==='ready')drawReady();else if(s==='race')drawRace();else if(s==='laps')drawLaps();
  else if(s==='wizard')drawWizard();else if(s==='trackmap')drawTrackMap();else if(s==='settings')drawSettings();else if(s==='tracks')drawTracks();else if(s==='days')drawDays();else if(s==='day')drawDay();
  else if(s==='confirmDayDel'){const d=(saved.days||[])[dev.dayIdx];drawConfirm('Cancellare questa giornata?',d?`${dayName(d.date)}: ${d.laps.length} giri cancellati per sempre`:'','Cancella',()=>{saved.days.splice(dev.dayIdx,1);persist();dev.screen='days';toast('Giornata cancellata')},'day')}
  else if(s==='confirmReset')drawConfirm('Chiudere la giornata?',`I ${lt.laps.length} giri vanno in Giornate, divisi per turno, e oggi riparte da zero`,'Chiudi giornata',()=>{closeDay();dev.screen='ready';toast('Giornata salvata in Giornate')},'laps');
  else if(s==='confirmSwitch')drawConfirm('Cambiare pista?',`I ${lt.laps.length} giri fatti qui vanno in Giornate`,'Cambia pista',()=>{closeDay();useTrack(dev.tsel);dev.screen='ready';toast(saved.tracks[dev.tsel].name+' selezionata')},'tracks');
  else if(s==='confirmDel'){const t=saved.tracks[dev.tsel];drawConfirm(`Cancellare ${t?t.name:'la pista'}?`,t&&t.record?`Si perde anche il record (${fmt(t.record)})`:'Il traguardo salvato viene eliminato','Cancella',()=>{const i=dev.tsel;saved.tracks.splice(i,1);persist();
    if(i===dev.track){lt.clearLine();dev.track=-1}else if(i<dev.track)dev.track--;dev.tsel=Math.min(i,saved.tracks.length-1);dev.screen='tracks';toast('Pista cancellata')},'tracks')}
  if(dev.toast&&now()<dev.toastUntil){cx.font=FL(15,700);const w=cx.measureText(dev.toast).width+32;rr((W-w)/2,SB+8,w,28,8,C.btn);txt(dev.toast,W/2,SB+22.5,15,C.fg,'center',600)}}

function autoScreens(){const s=dev.screen;
  if(dev.lastT&&now()-dev.lastPerf>4000)dev.fix=false;     // nessun punto GPS da 4 s
  if(s==='boot'&&dev.fix)dev.screen=dev.speed>15?'race':'ready';
  if(['ready','laps','settings','tracks','trackmap','days','day'].includes(s)&&dev.speed>15&&dev.fix)dev.screen='race';
  if(s==='race'){if(dev.fix&&dev.speed<3){if(dev.stillSince==null)dev.stillSince=now();else if(now()-dev.stillSince>3000){dev.screen='ready';dev.stillSince=null;
    // fermo: il giro in corso si annulla (non conta la sosta); quando riparti il giro nuovo parte dal traguardo
    if(lt.inLap){lt.inLap=false;lt.deltaValid=false;dev.lapPts=[];dev.sd=null;toast('Fermo: giro in corso annullato')}}}else dev.stillSince=null}
  if(s==='wizard'&&dev.wiz===3&&now()-dev.wizDoneAt>2500)dev.screen=dev.speed>15?'race':'ready'}

// ===================== tocco =====================
const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
const hitAt=p=>{for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h)return h}return null};
cv.addEventListener('pointerdown',e=>{keepAwake();const p=pt(e),h=hitAt(p);pressed=h?h.id:null;try{cv.setPointerCapture(e.pointerId)}catch(x){}
  const z=scrollZone;drag=null;if(z&&z.max>0&&p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h){dev[z.key+'V']=0;drag={key:z.key,max:z.max,y0:p.y,s0:dev[z.key]||0,on:false,ly:p.y,lt:performance.now(),v:0}}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),dy=p.y-drag.y0;if(!drag.on&&Math.abs(dy)>6){drag.on=true;pressed=null}
  if(drag.on){const t=performance.now(),dt=Math.max(1,t-drag.lt);drag.v=0.6*drag.v+0.4*(-(p.y-drag.ly)/dt*16.7);drag.ly=p.y;drag.lt=t;
    dev[drag.key]=Math.max(0,Math.min(drag.max,drag.s0-dy))}});
cv.addEventListener('pointerup',e=>{if(drag&&drag.on){if(performance.now()-drag.lt<80)dev[drag.key+'V']=drag.v;drag=null;pressed=null;return}drag=null;
  const h=hitAt(pt(e));if(h&&h.id===pressed){if(h.dis){if(h.id==='wok')toast(dev.speed>5?'Prima fermati':'Aspetta il GPS')}else if(h.act){h.act();try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}}}pressed=null;setTimeout(goFull,50)});
cv.addEventListener('pointercancel',()=>{pressed=null;drag=null});

// ===================== avvio =====================
resize();keepAwake();
if(saved.source==='demo'){}else{startPhoneGps();if(saved.source==='ble')bleAuto()}
let last=performance.now();
function loop(t){let dt=Math.min(200,t-last);last=t;
  if(stage.clientWidth!==lastVW||stage.clientHeight!==lastVH||innerWidth!==lastIW||innerHeight!==lastIH||!cv.width)resize();
  const ld=document.getElementById('loading');if(ld&&cv.width)ld.remove();
  try{if(saved.source==='demo')while(dt>0){const d=Math.min(5,dt);demoStep(d);dt-=d}}catch(e){window.__errs.push(String(e&&e.message||e))}
  try{autoScreens();render()}catch(e){window.__errs.push(String(e&&e.message||e))}
  if(window.__errs.length){cx.setTransform(scale,0,0,scale,0,0);cx.fillStyle='rgba(120,0,0,.9)';cx.fillRect(0,H-40,W,40);cx.fillStyle='#fff';cx.font='12px sans-serif';cx.textAlign='left';cx.textBaseline='top';
    cx.fillText('ERRORE: '+window.__errs[window.__errs.length-1].slice(0,60),6,H-36);cx.fillText(navigator.userAgent.replace(/.*Chrome\/(\d+).*/,'Chrome $1'),6,H-20)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol==='https:'){let had=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})}
window.__ftt={dev,lt,demo,saved,ble,decodeBlePos,get hits(){return hits},setSource,onGeo};
}
</script>
